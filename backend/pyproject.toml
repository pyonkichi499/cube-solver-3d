[project]
name = "cube-solver-3d"
version = "0.1.0"
description = "3D Rubik's Cube solver with visualization"
license = "MIT"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi==0.109.0",
    "uvicorn==0.27.0",
    "pydantic==2.5.3",
    "kociemba==1.2.1",
    "numpy==1.26.3",
    "python-multipart==0.0.6",
    "cors==1.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.rye]
managed = true
dev-dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["."]

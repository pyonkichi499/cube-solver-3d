[project]
name = "cube-solver-3d"
version = "0.1.0"
description = "3D Rubik's Cube solver with visualization"
license = "MIT"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi==0.109.0",
    "uvicorn==0.27.0",
    "pydantic==2.5.3",
    "kociemba==1.2.1",
    "numpy==1.26.3",
    "python-multipart>=0.0.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.rye]
managed = true
dev-dependencies = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "pytest-asyncio>=0.23.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

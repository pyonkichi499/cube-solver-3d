version: '3.8'

services:
  backend:
    build: ./backend
    container_name: cube-solver-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - ENV=development
    networks:
      - cube-solver-network

  frontend:
    build: ./frontend
    container_name: cube-solver-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://localhost:8000
    networks:
      - cube-solver-network

networks:
  cube-solver-network:
    driver: bridge
